<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ลงวัน VAC</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--ac:#0f6e56;--acbg:#e1f5ee;--bd:#e2e0d8;--wr:#b4540a;--wrbg:#fdf0e1;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#171716;--card:#22221f;--tx:#efeee8;--mu:#9a988f;--ac:#5dcaa5;--acbg:#10372c;--bd:#38372f;--wr:#f0a35e;--wrbg:#3a2a16;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Noto Sans Thai",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 14px;border-bottom:1px solid var(--bd)}
#hd{max-width:520px;margin:0 auto;display:flex;justify-content:space-between;font-size:14px}
#st{display:flex;gap:4px;margin:8px auto 0;max-width:520px;font-size:12px}
#st span{flex:1;text-align:center;padding:4px 2px;border-radius:6px;background:var(--card);color:var(--mu)}
#st .on{background:var(--ac);color:#fff}#st .dn{background:var(--acbg);color:var(--ac)}
main{padding:12px 14px 60px;max-width:520px;margin:0 auto}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.m{color:var(--mu);font-size:13px}
.r{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
button,select,input{font:inherit;padding:9px 14px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button:disabled{opacity:.4}
.row{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--bd)}
.chip{font-size:12px;padding:1px 8px;border-radius:10px;background:var(--bd);color:var(--mu)}
.chip.l{background:var(--acbg);color:var(--ac)}
.big{font-size:44px;font-weight:700;color:var(--ac);text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal b{font-size:12px;text-align:center;color:var(--mu);font-weight:400}
.d{padding:6px 0;text-align:center;border-radius:8px;background:var(--bg);border:1px solid var(--bd);font-size:14px;min-height:46px}
.d small{display:block;font-size:10px;color:var(--mu)}
.d.f{opacity:.4;text-decoration:line-through}.d.s{background:var(--ac);color:#fff}.d.s small{color:#fff}
.w{color:var(--wr);background:var(--wrbg);padding:6px 10px;border-radius:8px}
#t{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;opacity:0;transition:.2s;font-size:13px;pointer-events:none;z-index:20}
</style></head><body>
<header><div id="hd"></div><div id="st"></div></header>
<main id="v">กำลังโหลด…</main><div id="t"></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const LIFF_ID='2012452564-UhKoO4Jw',API='https://dmvlkgvyczfhlvdbzvai.supabase.co/functions/v1/vac-api';
const ERR={long_full:'VAC ยาวเต็มแล้ว นับเป็น VAC สั้นแทน',day_full:'วันนี้เต็มแล้ว',limit:'ครบจำนวนวันสูงสุดแล้ว',not_your_turn:'ยังไม่ถึงคิวคุณ',too_early:'ต้องรอครบ 30 นาทีก่อน',wrong_phase:'ขั้นตอนนี้ปิดแล้ว',name_taken:'ชื่อนี้มีคนเลือกไปแล้ว',undrawn_left:'ยังมีคนที่ยังไม่สุ่ม',cannot_swap:'สลับไม่ได้',out_of_month:'นอกเดือนที่เปิดรอบ',not_admin:'เฉพาะแอดมิน',cannot_draw:'สุ่มไม่ได้'};
const lab={long:'VAC ยาว',cnl:'CNL VAC',short:'VAC สั้น'};
let S=null,last='',off=0,ed=false;
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#t');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2600)}
async function call(action,args={}){
 const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idToken:liff.getIDToken(),action,args})});
 const j=await r.json();
 if(r.status==401){liff.logout();liff.login();throw new Error('login')}
 if(!r.ok)throw new Error(j.error||'error');return j}
async function act(a,args){try{const r=await call(a,args);if(typeof r==='string'&&ERR[r])toast(ERR[r]);}catch(e){toast(ERR[e.message]||e.message)}await load()}
async function load(){try{const s=await call('state');const j=JSON.stringify(s);off=Date.parse(s.now)-Date.now();if(j!==last&&!(document.activeElement&&['SELECT','INPUT'].includes(document.activeElement.tagName))){last=j;S=s;R()}else S=s}catch(e){if(e.message!='login')$('#v').innerHTML='<div class="c w">เชื่อมต่อไม่ได้: '+E(e.message)+'</div>'}}
const P=i=>S.people.find(p=>p.id==i);
const key=d=>{const[y,m]=S.round.month_start.split('-');return y+'-'+m+'-'+String(d).padStart(2,'0')};
const cnt=d=>S.days.filter(x=>x.day==key(d)).length;
const rnk=()=>S.people.filter(p=>p.status=='short'&&p.rank).sort((a,b)=>a.rank-b.rank);
const chip=p=>`<span class="chip ${p.status=='long'?'l':''}">${p.status?lab[p.status]:'ยังไม่เลือก'}</span>`;
const roster=f=>`<div class="c">${S.people.map(p=>`<div class="row"><span>${E(p.name)}</span><span>${f(p)}</span></div>`).join('')}</div>`;
const elapsed=()=>Math.floor((Date.now()+off-Date.parse(S.round.turn_at))/1000);

function openForm(){const d=new Date();d.setMonth(d.getMonth()+1);const v=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
return `<div class="c"><b>เปิดรอบใหม่</b><div class="r"><input type="month" id="mo" value="${v}"><button class="p" onclick="if(confirm('เปิดรอบเดือน '+$('#mo').value+' ?'))act('open_round',{m:$('#mo').value+'-01'})">เปิดรอบ</button></div></div>`}

function vBind(){return `<div class="c"><b>ครั้งแรก: เลือกชื่อของคุณ</b><div class="m">เลือกได้ครั้งเดียว ถ้าเลือกผิดให้แจ้งแอดมิน</div><div class="r"><select id="bn">${(S.unbound||[]).map(u=>`<option value="${u.id}">${E(u.name)}</option>`).join('')}</select><button class="p" onclick="if(confirm('ยืนยันว่าคุณคือ '+$('#bn').selectedOptions[0].text+' ?'))act('bind',{emp:+$('#bn').value})">ยืนยัน</button></div></div>`}

function v1(m){const p=P(m.id);let h=`<div class="c"><b>รอบเดือน ${S.round.month_start.slice(0,7)}</b><div class="m">VAC ยาวแล้ว ${S.people.filter(x=>x.status=='long').length}/${S.round.max_long} · ไม่กดอะไร = VAC สั้น</div></div>`;
h+=`<div class="c"><b>สถานะของคุณ: ${p&&p.status?lab[p.status]:'ยังไม่เลือก (นับเป็น VAC สั้น)'}</b><div class="r"><button class="p" onclick="act('set_status',{s:'long'})">VAC ยาว</button><button onclick="act('set_status',{s:'cnl'})">CNL VAC</button><button onclick="act('set_status',{s:'short'})">VAC สั้น</button></div></div>`;
if(m.is_admin)h+=`<div class="c"><div class="r"><button class="p" onclick="if(confirm('ปิดรับแล้วไปสุ่มอันดับ?'))act('close_declare')">ปิดรับ → ไปสุ่มอันดับ</button></div></div>`;
return h+roster(chip)}

function v2(m){const p=P(m.id);let h='';
if(p.status=='short')h+=p.rank?`<div class="c"><div class="m" style="text-align:center">อันดับของคุณ</div><div class="big">#${p.rank}</div></div>`:`<div class="c"><b>ถึงเวลาสุ่มอันดับ</b><div class="r"><button class="p" onclick="act('draw')">🎲 กดสุ่ม</button></div></div>`;
else h+=`<div class="c">${p.status=='long'?'คุณใช้ VAC ยาว เลือกวันก่อนทุกคน':'คุณ CNL VAC ไม่ร่วมรอบนี้'}</div>`;
if(m.is_admin)h+=`<div class="c"><div class="m">แอดมินกดสุ่มแทนคนที่ไม่สุ่มได้ที่รายชื่อด้านล่าง</div><div class="r"><button class="p" onclick="act('to_swap')">ไปขั้นสลับอันดับ</button></div></div>`;
return h+roster(x=>x.status=='short'?(x.rank?'#'+x.rank:(m.is_admin?`<button onclick="act('draw',{target:${x.id}})">สุ่มให้</button>`:'ยังไม่สุ่ม')):chip(x))}

function v3(m){const p=P(m.id);let h='';
if(p.status=='short'){h+=`<div class="c"><b>อันดับของคุณ #${p.rank}</b><div class="r"><select id="sw">${rnk().filter(x=>x.id!=m.id).map(x=>`<option value="${x.id}">#${x.rank} ${E(x.name)}</option>`).join('')}</select><button class="p" onclick="act('req_swap',{other:+$('#sw').value})">ขอสลับ</button></div></div>`;
S.swaps.filter(s=>s.to_emp==m.id).forEach(s=>{h+=`<div class="c w">${E(P(s.from_emp).name)} ขอสลับอันดับกับคุณ<div class="r"><button class="p" onclick="act('ans_swap',{sid:${s.id},ok:true})">ยอมรับ</button><button onclick="act('ans_swap',{sid:${s.id},ok:false})">ปฏิเสธ</button></div></div>`});
S.swaps.filter(s=>s.from_emp==m.id).forEach(s=>{h+=`<div class="c m">รอ ${E(P(s.to_emp).name)} ตอบคำขอสลับ</div>`})}
else h+=`<div class="c">ไม่ต้องสลับอันดับ</div>`;
if(m.is_admin)h+=`<div class="c"><div class="m">คำขอสลับที่รออยู่: ${S.swaps.length}</div><div class="r"><button class="p" onclick="if(confirm('คอนเฟิร์มอันดับ? หลังจากนี้สลับไม่ได้'))act('confirm')">คอนเฟิร์มอันดับ → เริ่มเลือกวัน</button></div></div>`;
return h+`<div class="c">${rnk().map(x=>`<div class="row"><span>#${x.rank} ${E(x.name)}</span></div>`).join('')}</div>`}

function cal(c,can){const[y,mo]=S.round.month_start.split('-').map(Number),n=new Date(y,mo,0).getDate(),f=new Date(y,mo-1,1).getDay();
let h='<div class="cal">'+['อา','จ','อ','พ','พฤ','ศ','ส'].map(x=>`<b>${x}</b>`).join('')+'<span></span>'.repeat(f);
for(let d=1;d<=n;d++){const mine=S.days.some(x=>x.day==key(d)&&x.emp==c.id),k=cnt(d),cl=mine?'s':k>=S.round.day_cap?'f':'';h+=`<div class="d ${cl}" ${can?`onclick="act('toggle_day',{d:'${key(d)}'})"`:''}>${d}<small>${k}/${S.round.day_cap}</small></div>`}
return h+'</div>'}

function v4(m){const r=S.round,c=S.people.find(p=>p.qpos==r.turn),mine=c.id==m.id,late=elapsed()>=1800,can=mine||(m.is_admin&&late),mq=P(m.id).qpos,tot=Math.max(...S.people.map(p=>p.qpos||0));
let h=`<div class="c"><div class="m">ตอนนี้ถึงคิว (${r.turn}/${tot})</div><b style="font-size:20px">${E(c.name)}</b> ${chip(c)}<div id="tm" class="m"></div>`;
if(!mine)h+=`<div class="w" style="margin-top:8px">${!mq?'คุณ CNL VAC ไม่อยู่ในคิว':mq<r.turn?'คุณเลือกวันเสร็จแล้ว':`อีก ${mq-r.turn} คนถึงคิวคุณ`}</div>`;
h+=`<div class="m" style="margin-top:6px">ถัดไป: ${S.people.filter(p=>p.qpos>r.turn&&p.qpos<=r.turn+4).sort((a,b)=>a.qpos-b.qpos).map(p=>E(p.name)).join(' → ')||'-'}</div>`;
if(can)h+=`<div class="r"><button class="p" onclick="act('finish')">ยืนยัน → คิวถัดไป</button></div>`;
if(m.is_admin&&!mine)h+=`<div class="r"><button onclick="act('skip')" ${late&&r.turn<tot?'':'disabled'}>ข้ามไปคิวสุดท้าย</button></div><div class="m">แอดมินข้ามหรือลงวันให้ได้หลังครบ 30 นาที</div>`;
return h+cal(c,can)+`</div>`}

function v5(){return `<div class="c"><b>สรุปผล ✅</b></div><div class="c">${S.people.filter(p=>p.status&&p.status!='cnl').map(p=>`<div class="row"><span>${E(p.name)} ${chip(p)}</span><span>${S.days.filter(x=>x.emp==p.id).map(x=>+x.day.slice(8)).sort((a,b)=>a-b).join(', ')||'-'}</span></div>`).join('')}</div>`}

function R(){const m=S.me;
if(!m||!m.id){$('#hd').textContent='ลงวัน VAC';$('#st').innerHTML='';$('#v').innerHTML=vBind();return}
const r=S.round,ph=r?r.phase:0;
$('#hd').innerHTML=`<span>${E(m.name)} ${m.is_admin?'<span class="chip l">แอดมิน</span>':''}</span><span class="m">${r?r.month_start.slice(0,7):''}</span>`;
$('#st').innerHTML=r?['แจ้งสถานะ','สุ่มอันดับ','สลับ','เลือกวัน'].map((s,i)=>`<span class="${ph==i+1?'on':ph>i+1?'dn':''}">${i+1}.${s}</span>`).join(''):'';
let h;if(!r)h=m.is_admin?openForm():'<div class="c">ยังไม่เปิดรอบ รอแอดมินเปิดรอบ</div>';
else{h=[0,v1,v2,v3,v4,v5][ph](m);if(ph==5&&m.is_admin)h+=openForm()}
$('#v').innerHTML=h;tick()}
function tick(){const e=$('#tm');if(!e||!S||!S.round||S.round.phase!=4)return;const s=1800-elapsed();
if(s>0){e.className='m';e.textContent='เวลาเหลือ '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}else{e.className='w';e.textContent='เกิน 30 นาที — แอดมินข้ามหรือลงวันให้ได้'}}
(async()=>{try{await liff.init({liffId:LIFF_ID});if(!liff.isLoggedIn()){liff.login();return}await load();setInterval(load,4000);setInterval(tick,1000)}catch(e){$('#v').innerHTML='<div class="c w">เปิดแอปไม่ได้: '+E(e.message)+'</div>'}})();
</script></body></html>
